<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Relacional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="inscripcionesUNAC_styles.css">
</head>
<body>
    <div class="form-container">
        <div class="header-flex">
            <h2>FORMULARIO DE<br>INSCRIPCIÓN</h2>
            <img src="ep.png" alt="Logo" class="logo">
        </div>
        <form action="proceso_form_preinscripcion.php" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" placeholder="Personal o Institucional" required>
            </div>
            <div class="form-group">
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" maxlength="8" pattern="\d{8}" placeholder="8 dígitos" required>
            </div>
            <div class="form-group">
                <label for="nombre">Nombres:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Apellido completo" required>
            </div>
            <div class="form-group">
                <label for="unidad">Unidad:</label>
                <select id="unidad" name="unidad" required onchange="cargarProgramas()">
                    <option value="">Seleccione</option>
                </select>
            </div>
            <div class="form-group">
                <label for="programa">Programa:</label>
                <select id="programa" name="programa" required onchange="cargarDetalles()">
                    <option value="">Seleccione</option>
                </select>
            </div>
            <div class="form-group detalle-programa-group">
                <label for="detalle_programa">Detalle del Programa:</label>
                <select id="detalle_programa" name="detalle_programa" size="5" required>
                    <option value="">Seleccione</option>
                </select>
                <div id="detalle_seleccionado" class="detalle-seleccionado"></div>
            </div>
            <div class="form-group">
                <label for="domicilio">Lugar donde vives:</label>
                <div class="domicilio-btn-group">
                    <label>
                        <input type="radio" name="domicilio" value="Lima" required>
                            Lima
                    </label>
                    <label>
                        <input type="radio" name="domicilio" value="Provincia" required>
                        Provincia
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>
            <div class="form-group">
                <label for="telefono">Celular:</label>
                <input type="text" id="telefono" name="telefono" maxlength="9" pattern="\d{9}" placeholder="9 dígitos sin espacios" required>
            </div>
            <div class="form-group">
                <label for="medio_conocimiento">Medio de conocimiento:</label>
                <select id="medio_conocimiento" name="medio_conocimiento" required>
                    <option value="">Seleccione</option>
                    <option value="Redes Sociales">Redes Sociales</option>
                    <option value="Página web">Página web</option>
                    <option value="Recomendación">Recomendación</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div class="form-group captcha-group">
                <div class="g-recaptcha" data-sitekey="6LdtvVMrAAAAAFOIiU2CFLJN9UqcsBh6GvC6h--W"></div>
            </div>
            <button type="submit" id="btn-enviar">
                <span class="spinner" style="display:none;"></span>
                <span class="btn-text">Enviar</span>
            </button>
        </form>
    </div>
    <script src="form_script.js"></script>
</body>
</html>

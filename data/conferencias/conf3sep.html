<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferencia</title>
    <style>
        /* Estilo general de la página */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        /* Contenedor del "PDF" */
        .pdf-container {
            width: 800px;  /* Ajustamos el tamaño para imágenes horizontales */
            height: 533px; /* Ajustamos la altura para mantener la relación de aspecto */
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: white;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Imagen simulada como página de PDF */
        .pdf-page {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Esto mantiene la relación de aspecto y ajusta la imagen sin distorsionarla */
            display: none;  /* Ocultamos las imágenes por defecto */
        }

        /* Estilos para los botones de navegación */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 5px;
            z-index: 1;
        }

        .prev-button {
            left: 10px;
        }

        .next-button {
            right: 10px;
        }

        .nav-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* Efecto de transición para las imágenes */
        .pdf-page.active {
            display: block;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .pdf-page.inactive {
            opacity: 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="pdf-container">
        <!-- Imágenes simulando páginas de un PDF (en formato horizontal) -->
        <img src="archivos/01.jpg" class="pdf-page active" id="page1">
        <img src="archivos/02.jpg" class="pdf-page" id="page2">
        <img src="archivos/03.jpg" class="pdf-page" id="page3">
        <img src="archivos/04.jpg" class="pdf-page" id="page3">
        <img src="archivos/05.jpg" class="pdf-page" id="page3">
        <img src="archivos/06.jpg" class="pdf-page" id="page3">
        <img src="archivos/07.jpg" class="pdf-page" id="page3">
        <img src="archivos/08.jpg" class="pdf-page" id="page3">
        <img src="archivos/09.jpg" class="pdf-page" id="page3">
        <img src="archivos/10.jpg" class="pdf-page" id="page3">
        <img src="archivos/11.jpg" class="pdf-page" id="page3">
        <img src="archivos/12.jpg" class="pdf-page" id="page3">
        <img src="archivos/13.jpg" class="pdf-page" id="page3">
        <img src="archivos/14.jpg" class="pdf-page" id="page3">
        <img src="archivos/15.jpg" class="pdf-page" id="page3">
        <img src="archivos/16.jpg" class="pdf-page" id="page3">
        <img src="archivos/17.jpg" class="pdf-page" id="page3">
        <img src="archivos/18.jpg" class="pdf-page" id="page3">
        <img src="archivos/19.jpg" class="pdf-page" id="page3">
        <img src="archivos/20.jpg" class="pdf-page" id="page3">
        <img src="archivos/21.jpg" class="pdf-page" id="page3">
        <img src="archivos/22.jpg" class="pdf-page" id="page3">
        <img src="archivos/23.jpg" class="pdf-page" id="page3">
        <img src="archivos/24.jpg" class="pdf-page" id="page3">
        <img src="archivos/25.jpg" class="pdf-page" id="page3">
        <img src="archivos/26.jpg" class="pdf-page" id="page3">
        <img src="archivos/27.jpg" class="pdf-page" id="page3">
        <img src="archivos/28.jpg" class="pdf-page" id="page3">
        <img src="archivos/29.jpg" class="pdf-page" id="page3">
        
        <!-- Botones de navegación -->
        <button class="nav-button prev-button" onclick="cambiarPagina(-1)">&#10094;</button>
        <button class="nav-button next-button" onclick="cambiarPagina(1)">&#10095;</button>
    </div>

    <script>
        let currentPage = 0;
        const pages = document.querySelectorAll('.pdf-page');

        function cambiarPagina(direccion) {
            // Ocultar la página actual
            pages[currentPage].classList.remove('active');
            pages[currentPage].classList.add('inactive');
            
            // Calcular la nueva página
            currentPage += direccion;
            
            // Asegurarse de que la página esté dentro del rango
            if (currentPage < 0) {
                currentPage = pages.length - 1; // Volver a la última página
            } else if (currentPage >= pages.length) {
                currentPage = 0; // Volver a la primera página
            }

            // Mostrar la nueva página
            pages[currentPage].classList.remove('inactive');
            pages[currentPage].classList.add('active');
        }

        // Bloquear el clic derecho en toda la página
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault(); // Prevenir el menú contextual
            alert("El clic derecho está deshabilitado en esta página.");
        });
    </script>
</body>
</html>
